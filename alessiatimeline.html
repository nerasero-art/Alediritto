        // Funzione per renderizzare la timeline
        function renderTimeline(dataToRender) {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            if (dataToRender.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-stone-500 italic">Nessun evento trovato con i criteri di ricerca.</div>`;
                return;
            }

            dataToRender.forEach((item, index) => {
                const isEven = index % 2 === 0;
                
                const cardHTML = `
                    <div class="relative pl-8 md:pl-12 group">
                        <!-- Cerchio icona sulla linea temporale -->
                        <div class="absolute -left-[18px] md:-left-[22px] top-6 w-9 h-9 md:w-11 md:h-11 rounded-full bg-stone-900 text-amber-400 flex items-center justify-center shadow-lg border-2 border-white text-sm md:text-base group-hover:scale-110 transition-transform">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>

                        <!-- Card dell'evento -->
                        <div class="${item.classStyle} p-6 rounded-2xl shadow-md hover:shadow-xl transition-all border border-stone-200">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                                <span class="inline-block bg-stone-900 text-amber-400 font-bold px-3 py-1 rounded-md text-sm tracking-wide">
                                    ${item.year}
                                </span>
                                <span class="text-xs uppercase font-semibold text-stone-600 tracking-wider bg-white px-2.5 py-1 rounded-full border border-stone-300">
                                    ${item.symbolText} - ${item.epochName}
                                </span>
                            </div>

                            <h3 class="text-xl md:text-2xl font-bold text-stone-900 mb-2" style="font-family: 'Times New Roman', Times, serif;">
                                ${item.title}
                            </h3>
                            
                            <p class="text-stone-700 text-base mb-4 leading-relaxed">
                                ${item.shortDesc}
                            </p>

                            <!-- Bottone per aprire l'ipertesto dettagliato -->
                            <button onclick="openEventDetail(${item.id})" class="inline-flex items-center gap-2 bg-stone-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-amber-700 transition shadow">
                                <i class="fa-solid fa-book-open-reader"></i> Esplora Collegamenti Interdisciplinari
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Filtro per epoca
        function filterEpoch(epoch) {
            if (epoch === 'all') {
                renderTimeline(eventsData);
            } else {
                const filtered = eventsData.filter(e => e.epoch === epoch);
                renderTimeline(filtered);
            }
        }

        // Filtro di ricerca testuale
        function filterEvents() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = eventsData.filter(e => 
                e.title.toLowerCase().includes(query) || 
                e.year.toLowerCase().includes(query) || 
                e.shortDesc.toLowerCase().includes(query) ||
                e.fullDesc.toLowerCase().includes(query) ||
                e.epochName.toLowerCase().includes(query)
            );
            renderTimeline(filtered);
        }

        // Apertura Modale dettagli e ipertesto
        function openEventDetail(id) {
            const event = eventsData.find(e => e.id === id);
            if (!event) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-12 h-12 rounded-full bg-amber-600 text-white flex items-center justify-center text-xl shadow">
                        <i class="fa-solid ${event.icon}"></i>
                    </div>
                    <div>
                        <span class="text-xs font-bold uppercase text-amber-700 tracking-wider">${event.epochName} • ${event.symbolText}</span>
                        <h2 class="text-2xl md:text-3xl font-bold text-stone-900" style="font-family: 'Times New Roman', Times, serif;">${event.year} - ${event.title}</h2>
                    </div>
                </div>

                <div class="space-y-4 text-stone-800 text-base leading-relaxed mb-6">
                    <p class="bg-stone-50 p-4 rounded-xl border border-stone-200">
                        <strong>Spiegazione Generale:</strong> ${event.fullDesc}
                    </p>

                    <h4 class="text-lg font-bold text-stone-900 border-b pb-1 mt-4">
                        <i class="fa-solid fa-network-wired text-amber-600 mr-2"></i>Collegamenti Interdisciplinari
                    </h4>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-amber-50 p-3.5 rounded-xl border border-amber-200">
                            <h5 class="font-bold text-amber-900 mb-1"><i class="fa-solid fa-landmark text-amber-700 mr-2"></i>Storia</h5>
                            <p class="text-sm text-stone-700">${event.links.storia}</p>
                        </div>
                        <div class="bg-sky-50 p-3.5 rounded-xl border border-sky-200">
                            <h5 class="font-bold text-sky-900 mb-1"><i class="fa-solid fa-scale-balanced text-sky-700 mr-2"></i>Diritto</h5>
                            <p class="text-sm text-stone-700">${event.links.diritto}</p>
                        </div>
                        <div class="bg-emerald-50 p-3.5 rounded-xl border border-emerald-200">
                            <h5 class="font-bold text-emerald-900 mb-1"><i class="fa-solid fa-book text-emerald-700 mr-2"></i>Italiano</h5>
                            <p class="text-sm text-stone-700">${event.links.italiano}</p>
                        </div>
                        <div class="bg-purple-50 p-3.5 rounded-xl border border-purple-200">
                            <h5 class="font-bold text-purple-900 mb-1"><i class="fa-solid fa-coins text-purple-700 mr-2"></i>Economia Politica</h5>
                            <p class="text-sm text-stone-700">${event.links.economia}</p>
                        </div>
                    </div>
                </div>

                <div class="text-right">
                    <button onclick="closeModal()" class="bg-stone-900 text-white px-5 py-2.5 rounded-lg hover:bg-stone-800 transition font-medium">
                        Chiudi Finestra
                    </button>
                </div>
            `;

            const modal = document.getElementById('eventModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('eventModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // Chiudi modale cliccando fuori
        window.onclick = function(event) {
            const modal = document.getElementById('eventModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Inizializzazione al caricamento
        window.onload = function() {
            renderTimeline(eventsData);
        };
    </script>
</body>
</html>
